# dsh-session-sync 宿主插件：自部署的服务端同步（会话 / 附件 / 设备台账 / agent 笔记）。
#
# 本文件由 profile 加载器作为 bundle 补丁读入，把插件插进配置树。
# 配置项含义见 README.md 与 docs/DESIGN.md；非敏感项可在 Plugins 设置页编辑。
- insert:
    - id: session-sync
      name: 'dsh-session-sync'
      config:
        # 总开关；关掉后插件仍然加载，但不做任何同步。
        enabled: true
        # 自部署服务端地址，例如 http://127.0.0.1:8787；空表示未配置。
        serverUrl: ''
        # 管理台/CLI 签发的设备 token；仅作 bootstrap fallback。
        # 推荐在 DSH 凭据库写 DSH_SESSION_SYNC_TOKEN。
        token: ''
        # 同步口令；仅作 bootstrap fallback。
        # 推荐在 DSH 凭据库写 DSH_SESSION_SYNC_PASSPHRASE。
        passphrase: ''
        # 可选：base64 的 16 字节 KDF 盐；空表示由 serverUrl 派生。
        salt: ''
        # 本设备在台账/日志里的短标签；空表示未使用。
        deviceName: ''
        # 拉取会话挂载的本地工作区路径；空表示只推送不拉取。
        workspacePath: ''
        # 允许同步的工作区路径；空表示未配置、暂不同步。
        workspaceAllowlist: []
        # 是否按间隔自动推送；false 时只做一次启动推送。
        autoSync: true
        # 自动推送间隔（毫秒）。
        intervalMs: 60000
        # 是否同步子代理会话（根 + 后代闭包）。
        includeSubagents: true
        # 单批最多事件数 / 规范 JSON 字节数。
        batchEvents: 50
        batchBytes: 262144
        # 单次 HTTP 读取超时（毫秒）。
        requestTimeoutMs: 10000
