# Release via npm trusted publishing (GitHub OIDC), and attach the exact npm
# tarball to the matching GitHub Release.
#
# First release only (the package name must exist before npm can attach a
# trusted publisher):
#
#   cd packages/plugin
#   npm login
#   npm publish
#   npm trust github dsh-session-cloudsync \
#     --repo xfy2412/dsh-session-cloudsync --file publish.yml --allow-publish
#
# Later releases: bump packages/plugin/package.json, commit, tag
# `v<version>` or `plugin-v<version>`, and push the tag.
name: publish-plugin

on:
  push:
    tags: ['v*', 'plugin-v*']
  workflow_dispatch:

permissions:
  contents: write
  # Required for the npm OIDC exchange.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      # A tag-triggered run must name the version it publishes, so a stray tag
      # cannot ship the plugin under a different version number.
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="v$(node -p 'require("./packages/plugin/package.json").version')"
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" == plugin-v* ]]; then tag="v${tag#plugin-v}"; fi
          if [[ "$version" != "$tag" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
      # Re-running a tag (or publishing the version that bootstrapped the name)
      # must not fail because the registry already has it.
      - id: published
        working-directory: packages/plugin
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${name}@${version} is already on the registry; nothing to publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # Build the exact tarball once; prepack builds lib/ and client assets.
      - id: package
        working-directory: packages/plugin
        run: |
          # prepack shares stdout; the tarball name is the final output line.
          tarball="$(npm pack --silent | tail -n 1)"
          if [[ ! -f "$tarball" ]]; then
            echo "npm pack did not create a tarball (got: $tarball)" >&2
            exit 1
          fi
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
      - if: steps.published.outputs.skip != 'true'
        working-directory: packages/plugin
        run: npm publish
      # Attach the same tarball to the GitHub Release. Re-runs replace assets.
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: packages/plugin
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" "${{ steps.package.outputs.tarball }}" --clobber
